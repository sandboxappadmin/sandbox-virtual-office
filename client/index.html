<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Office</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <h1>🏢 Virtual Office</h1>
      <p>Enter your name to join the office</p>
      <input id="player-name" type="text" placeholder="Your name" maxlength="20" />
      <div class="avatar-picker">
        <label>Pick your avatar:</label>
        <div class="avatars">
          <div class="avatar-opt selected" data-idx="0">🧑</div>
          <div class="avatar-opt" data-idx="1">👩</div>
          <div class="avatar-opt" data-idx="2">🧔</div>
          <div class="avatar-opt" data-idx="3">👱</div>
          <div class="avatar-opt" data-idx="4">🧕</div>
          <div class="avatar-opt" data-idx="5">🧑‍💼</div>
        </div>
      </div>
      <button id="join-btn">Enter Office</button>
    </div>
  </div>

  <div id="game-container" style="display:none;">
    <div id="phaser-canvas"></div>

    <!-- Chat panel -->
    <div id="chat-panel">
      <div id="chat-header">
        <span>💬 Office Chat</span>
        <button id="chat-toggle">—</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" placeholder="Say something..." maxlength="200" />
        <button id="chat-send">→</button>
      </div>
    </div>

    <!-- Player list -->
    <div id="player-list">
      <div id="pl-header">👥 In Office</div>
      <div id="pl-body"></div>
    </div>

    <!-- Video call overlay -->
    <div id="call-overlay" style="display:none;">
      <div id="call-header">
        <span id="call-title">📹 Video Call</span>
        <button id="end-call-btn">End Call</button>
      </div>
      <div id="videos">
        <div class="video-wrap">
          <video id="local-video" autoplay muted playsinline></video>
          <span class="video-label">You</span>
        </div>
        <div class="video-wrap">
          <video id="remote-video" autoplay playsinline></video>
          <span class="video-label" id="remote-name">Connecting...</span>
        </div>
      </div>
      <div id="call-controls">
        <button id="toggle-mic" title="Mute/Unmute">🎤</button>
        <button id="toggle-cam" title="Camera On/Off">📷</button>
      </div>
    </div>

    <!-- Proximity toast -->
    <div id="proximity-toast" style="display:none;"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
